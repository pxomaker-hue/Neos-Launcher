name: Publish Neos v0.6.22 ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-neos-v0622.yml'
      - '.neos-build/rebuild-v0622.py'
      - '.neos-build/neos-v0.6.22.delta.b64'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Rebuild and verify ZIP
        run: python3 .neos-build/rebuild-v0622.py
      - name: Commit ZIP release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add neos-nextcloud35-v0.6.22.zip
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Neos v0.6.22 ZIP'
          git push origin HEAD:main
