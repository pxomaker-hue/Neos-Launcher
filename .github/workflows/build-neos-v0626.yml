name: Publish Neos v0.6.26 ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Rebuild and verify Neos v0.6.26
        run: python3 .neos-build/rebuild-v0626.py
      - name: Publish ZIP
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add archive/releases/v0.6/neos-nextcloud35-v0.6.26.zip
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Neos v0.6.26 ZIP'
          git push origin HEAD:main
