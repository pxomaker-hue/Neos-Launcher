name: Publish Neos v0.6.33 ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-neos-v0633.yml'
      - '.neos-build/rebuild-v0633.py'
      - '.neos-build/patch-v0633.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published Neos releases
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Rebuild v0.6.33 from Work v0.6.32 and validate contents
        run: python3 .neos-build/rebuild-v0633.py
      - name: Publish installable ZIP
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add neos-nextcloud35-v0.6.33.zip
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Neos v0.6.33 ZIP (Deck Tasks home widget)'
          git push origin HEAD:main
