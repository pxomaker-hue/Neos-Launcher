<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neos v0.6.5 — Aperçu interactif</title><style>
/* NEOS / FLAT CYBER 0.4.6 — authored UI system for Nextcloud 35 */
#nova-root{
  --bg:#070d1a;--panel:#111b2e;--panel-2:#142037;--panel-3:#18263e;
  --line:#253550;--line-strong:#385178;--text:#edf4ff;--muted:#8293b1;
  --accent:#48cafa;--accent-2:#8a84f8;--accent-soft:rgba(72,202,250,.12);
  --radius:17px;--space:16px;--pad:20px;
  color:var(--text);background:var(--bg);font:14px/1.48 Inter,"Segoe UI",system-ui,sans-serif;
  position:fixed!important;inset:var(--header-height,50px) 0 0!important;
  width:100vw!important;max-width:none!important;height:calc(100dvh - var(--header-height,50px))!important;
  padding:0!important;margin:0!important;overflow:auto hidden!important;z-index:15;isolation:isolate;
  color-scheme:dark;font-synthesis:none;-webkit-font-smoothing:antialiased;
}
#nova-root[data-density="compact"]{--space:12px;--pad:15px}
#nova-root[data-accent="indigo"]{--accent:#9297ff;--accent-2:#55d1ff;--accent-soft:rgba(146,151,255,.12)}
#nova-root[data-accent="emerald"]{--accent:#46ddbd;--accent-2:#5bcbff;--accent-soft:rgba(70,221,189,.12)}
#nova-root[data-accent="rose"]{--accent:#c18aff;--accent-2:#ff83c1;--accent-soft:rgba(193,138,255,.12)}
#nova-root[data-accent="amber"]{--accent:#f0be68;--accent-2:#5ed7ff;--accent-soft:rgba(240,190,104,.11)}
#nova-root.neos-light{--bg:#edf2fa;--panel:#fff;--panel-2:#f6f9ff;--panel-3:#edf4ff;--line:#d9e3f0;--line-strong:#b7c8de;--text:#1c2a40;--muted:#657a99;color-scheme:light}
#nova-root *,#nova-root *::before,#nova-root *::after{box-sizing:border-box}
#nova-root a{color:inherit;text-decoration:none}
#nova-root button,#nova-root input,#nova-root select,#nova-root textarea{font:inherit}
#nova-root button{cursor:pointer}
#nova-root button:disabled{opacity:.35;cursor:not-allowed}
#nova-root button:focus-visible,#nova-root input:focus-visible,#nova-root select:focus-visible,#nova-root textarea:focus-visible,#nova-root a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#nova-root input,#nova-root select,#nova-root textarea{min-width:0}
#nova-root svg{flex-shrink:0}

/* Ambient layer is fixed and never recreated during file navigation */
#nova-root .neos-ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;isolation:isolate;background:
  radial-gradient(ellipse 60% 40% at 70% 5%,rgba(69,65,166,.19),transparent 72%),
  radial-gradient(ellipse 70% 42% at 0 10%,rgba(9,87,158,.17),transparent 70%),
  linear-gradient(165deg,#091326 0%,#070d1a 54%,#081429 100%)}
#nova-root .neos-ambient-mesh,#nova-root .neos-ambient-grid,#nova-root .neos-ambient-beam,#nova-root .neos-ambient-aurora,#nova-root .neos-ambient-noise,#nova-root .neos-ambient-orbits{position:absolute;inset:0;width:100%;height:100%}
#nova-root .neos-ambient-mesh{background:radial-gradient(circle at 88% 8%,rgba(83,104,230,.18),transparent 38%),radial-gradient(circle at 24% 80%,rgba(28,148,224,.09),transparent 32%);filter:blur(34px);animation:neos-mesh 28s ease-in-out infinite alternate}
#nova-root .neos-ambient-grid{background-image:linear-gradient(rgba(133,188,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(133,188,255,.045) 1px,transparent 1px);background-size:56px 56px;opacity:.28;mask-image:linear-gradient(to bottom,transparent,black 42%,transparent)}
#nova-root .neos-ambient-beam{background:linear-gradient(115deg,transparent 42%,rgba(52,156,254,.028) 50%,transparent 60%);animation:neos-beam 24s ease-in-out infinite alternate}
#nova-root .neos-ambient-aurora{background:radial-gradient(ellipse 38% 18% at 36% 76%,rgba(0,130,209,.10),transparent),radial-gradient(ellipse 32% 24% at 80% 68%,rgba(80,69,175,.085),transparent);animation:neos-mesh 22s ease-in-out infinite alternate-reverse}
#nova-root .neos-ambient-orbits{opacity:.36}
#nova-root .neos-ambient-noise{opacity:.14;background-image:url("../img/neos-field.svg");background-size:cover;background-position:center;mix-blend-mode:screen}
#nova-root .neos-datafield{position:absolute;inset:0;width:100%;height:100%;opacity:.75;pointer-events:none;mix-blend-mode:screen;mask-image:linear-gradient(to bottom,transparent,#000 25%,#000 80%,transparent)}
#nova-root.neos-light .neos-ambient{background:radial-gradient(ellipse at 20% 15%,rgba(112,164,255,.15),transparent 50%),linear-gradient(165deg,#f4f8ff,#e7f0fc)}
#nova-root.neos-light .neos-datafield{mix-blend-mode:multiply;opacity:.17}
#nova-root.neos-light .neos-ambient-noise{opacity:.05}
#nova-root[data-motion="subtle"] .neos-datafield{opacity:.35}
#nova-root[data-motion="off"] .neos-datafield,#nova-root[data-motion="off"] .neos-ambient-orbits{display:none!important}
#nova-root[data-motion="off"] .neos-ambient-mesh,#nova-root[data-motion="off"] .neos-ambient-beam,#nova-root[data-motion="off"] .neos-ambient-aurora{animation:none!important}

/* App surface: full-bleed width by default */
#nova-root .neos-shell{position:relative;min-height:100%;padding:22px clamp(16px,2.7vw,50px) 34px;z-index:1}
#nova-root .neos-layout{position:relative;width:100%;max-width:none;margin:0 auto;z-index:1}
#nova-root[data-layout="focused"] .neos-layout{max-width:1480px}
#nova-root .neos-topbar{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:24px;min-height:72px;padding:12px 18px;margin-bottom:18px;background:linear-gradient(180deg,rgba(18,29,52,.94),rgba(13,22,39,.92));border:1px solid color-mix(in srgb,var(--accent) 16%,var(--line));border-radius:18px;box-shadow:0 14px 45px rgba(0,3,12,.18),inset 0 1px 0 rgba(255,255,255,.03);backdrop-filter:blur(14px)}
#nova-root.neos-light .neos-topbar{background:rgba(255,255,255,.9)}
#nova-root .neos-brand{display:flex;align-items:center;gap:12px;min-width:140px}
#nova-root .neos-brand-mark{display:grid;place-items:center;width:50px;height:50px;border-radius:15px;background:linear-gradient(180deg,#12203a,#0a1530);border:1px solid color-mix(in srgb,var(--accent) 20%,var(--line));overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.22),0 0 0 1px rgba(255,255,255,.02) inset}
#nova-root .neos-brand-mark img{width:100%;height:100%;display:block;object-fit:contain}
#nova-root .neos-brand>div{display:flex;flex-direction:column;line-height:1.1;gap:3px}
#nova-root .neos-brand strong{font-size:20px;font-weight:760;letter-spacing:-.045em}
#nova-root .neos-brand>div>span{color:var(--muted);font-size:9px;font-weight:700;letter-spacing:.18em}
#nova-root .neos-launchbar{display:flex;justify-content:center;gap:6px;overflow:auto hidden;min-width:0;scrollbar-width:none}
#nova-root .neos-launchbar::-webkit-scrollbar{display:none}
#nova-root .neos-launch-chip{display:inline-flex;align-items:center;gap:10px;white-space:nowrap;border-radius:12px;padding:8px 13px 8px 10px;color:var(--muted);font-weight:640;background:rgba(255,255,255,.025);border:1px solid transparent;transition:background .2s,color .2s,transform .2s,border-color .2s,box-shadow .2s}
#nova-root .neos-launch-chip svg{color:var(--app,var(--accent))}
#nova-root .neos-launch-chip:hover{background:var(--panel-3);color:var(--text);transform:translateY(-1px);border-color:color-mix(in srgb,var(--app) 30%,var(--line));box-shadow:0 12px 28px rgba(0,0,0,.12)}
#nova-root .neos-launch-chip-art{display:grid;place-items:center;width:28px;height:28px;border-radius:10px;background:color-mix(in srgb,var(--app) 12%,var(--panel));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--app) 20%,transparent)}
#nova-root .neos-glyph-img{width:18px;height:18px;display:block;object-fit:contain}
#nova-root .neos-top-actions{display:flex;align-items:center;gap:8px;white-space:nowrap}
#nova-root .neos-header-readout{font-size:12px;letter-spacing:.02em;font-variant-numeric:tabular-nums;color:var(--muted);margin-right:7px}
#nova-root .neos-header-readout i{display:none}
#nova-root .neos-btn,#nova-root .neos-iconbtn,#nova-root .neos-crumb,#nova-root .neos-pin{display:inline-flex;justify-content:center;align-items:center;gap:9px;min-height:38px;padding:9px 13px;color:var(--text);background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:10px;font-weight:610;transition:background .2s,border-color .2s,transform .2s,box-shadow .2s}
#nova-root .neos-iconbtn{width:38px;height:38px;padding:0}
#nova-root .neos-btn:hover,#nova-root .neos-iconbtn:hover,#nova-root .neos-crumb:hover,#nova-root .neos-pin:hover{background:var(--panel-3);border-color:var(--line-strong);transform:translateY(-1px)}
#nova-root .neos-btn-primary{background:var(--accent);border-color:transparent;color:#081322;font-weight:750}
#nova-root .neos-btn-primary:hover{background:color-mix(in srgb,var(--accent) 86%,white);color:#081322;border-color:transparent;box-shadow:0 8px 25px rgba(40,155,255,.15)}
#nova-root .neos-iconbtn.is-on{color:var(--accent);background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 24%,var(--line))}
#nova-root .neos-warning,#nova-root .neos-editbar{display:flex;align-items:center;gap:9px;padding:13px 16px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;margin:0 0 16px;color:var(--muted)}
#nova-root .neos-fatal{display:flex;gap:12px;align-items:center;justify-content:center;min-height:380px;color:var(--text);padding:24px}

/* Responsive 12-column widgets */
#nova-root .neos-grid-cards{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--space)}
#nova-root .neos-card{grid-column:span 6;min-width:0;position:relative;overflow:hidden;padding:var(--pad);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 36px rgba(0,4,16,.12);transition:border-color .25s,box-shadow .25s,transform .25s}
#nova-root .neos-card::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(300px circle at var(--mx,50%) var(--my,0%),rgba(110,178,255,.045),transparent 70%);opacity:0;transition:opacity .25s}
#nova-root .neos-card:hover{border-color:var(--line-strong)}
#nova-root .neos-card:hover::after{opacity:1}
#nova-root .neos-card[data-size="3"]{grid-column:span 3}
#nova-root .neos-card[data-size="4"]{grid-column:span 4}
#nova-root .neos-card[data-size="6"]{grid-column:span 6}
#nova-root .neos-card[data-size="8"]{grid-column:span 8}
#nova-root .neos-card[data-size="12"]{grid-column:span 12}
#nova-root .neos-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px;min-width:0}
#nova-root .neos-card-name{display:flex;align-items:center;gap:10px;min-width:0;font-weight:720;font-size:15px;letter-spacing:-.015em}
#nova-root .neos-card-name svg{color:var(--accent)}
#nova-root .neos-card-actions{display:flex;align-items:center;gap:8px;min-width:0}
#nova-root .neos-card-sub{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
#nova-root .neos-card-body{min-width:0;position:relative;z-index:1}
#nova-root .neos-explorer{padding:0}
#nova-root .neos-explorer .neos-card-head{margin:0;padding:19px 22px 17px;border-bottom:1px solid var(--line)}
#nova-root .neos-explorer .neos-card-name{font-size:17px}
#nova-root .neos-explorer .neos-card-body{padding:18px}
#nova-root .neos-card.is-dragging{opacity:.5;transform:scale(.99)}

/* File workspace */
#nova-root .neos-browser-shell{display:grid;gap:15px;min-width:0}
#nova-root .neos-browser-tools{display:grid;gap:12px}
#nova-root .neos-breadcrumb{display:flex;align-items:center;gap:8px;min-width:0}
#nova-root .neos-breadcrumb-items{display:flex;align-items:center;gap:5px;min-width:0;flex-wrap:wrap}
#nova-root .neos-crumb{border:0;background:transparent;color:var(--muted);min-height:33px;padding:7px 9px;font-size:12px}
#nova-root .neos-crumb.active{background:var(--accent-soft);color:var(--accent);font-weight:700}
#nova-root .neos-nav-btn{width:33px;height:33px;min-height:33px;background:var(--panel-2)}
#nova-root .neos-browser-total{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
#nova-root .neos-browser-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#nova-root .neos-pins{grid-column:1/-1;display:flex;gap:7px;align-items:center;overflow:auto hidden;padding:1px 0 2px;scrollbar-width:none}
#nova-root .neos-pins::-webkit-scrollbar{display:none}
#nova-root .neos-pin{min-height:32px;font-size:11px;background:var(--panel-2);border:1px solid var(--line);padding:6px 10px;white-space:nowrap}
#nova-root .neos-search{display:flex;align-items:center;gap:9px;min-width:0;flex:1 1 280px;min-height:40px;padding:0 12px;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;color:var(--muted)}
#nova-root .neos-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
#nova-root .neos-search input{width:100%;min-width:0;padding:10px 0;background:transparent;color:var(--text);border:0!important;outline:0!important;box-shadow:none!important}
#nova-root .neos-search input::placeholder{color:var(--muted)}
#nova-root .neos-search kbd{display:inline-flex;min-width:19px;height:20px;align-items:center;justify-content:center;font-size:11px;font-family:inherit;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:5px}
#nova-root .neos-browser-actions select,#nova-root .neos-pref-tools select{height:40px;min-width:85px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:10px;padding:0 12px;outline:0}
#nova-root .neos-browser-actions select:focus{border-color:var(--accent)}
#nova-root .neos-browser-main{display:grid;grid-template-columns:minmax(0,1.07fr) minmax(340px,.93fr);gap:12px;align-items:stretch;min-width:0}
#nova-root .neos-browser-list-wrap,#nova-root .neos-preview{border:1px solid var(--line);border-radius:14px;background:var(--panel-2);min-width:0;overflow:hidden;min-height:520px}
#nova-root .neos-browser-list-wrap{display:flex;flex-direction:column}
#nova-root .neos-list-caption{display:grid;grid-template-columns:1fr 98px 90px;gap:10px;padding:13px 17px;color:var(--muted);font-weight:700;font-size:10px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
#nova-root .neos-file-list{display:grid;gap:2px;padding:8px;max-height:562px;overflow:auto}
#nova-root .neos-file-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;min-width:0;border-radius:12px;border:1px solid transparent;transition:background .18s,border-color .18s}
#nova-root .neos-file-row:hover{background:rgba(135,172,255,.055)}
#nova-root .neos-file-row.is-active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 22%,var(--line))}
#nova-root .neos-file-actions{display:flex;align-items:center;gap:6px;padding-right:4px}
#nova-root .neos-file-main{display:grid;grid-template-columns:40px minmax(0,1fr) 80px;gap:10px;align-items:center;width:100%;min-width:0;min-height:62px;text-align:left;border:0;background:transparent;color:var(--text);border-radius:9px;padding:8px 8px}
#nova-root .neos-file-symbol{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;overflow:hidden;color:#6caefe;background:rgba(73,135,232,.10);position:relative}
#nova-root .neos-file-symbol svg{z-index:1}
#nova-root .neos-file-symbol .neos-thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
#nova-root .neos-file-label{display:grid;gap:5px;min-width:0}
#nova-root .neos-file-label strong{font-size:12.5px;font-weight:640;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
#nova-root .neos-file-label small{font-size:10.5px;color:var(--muted);white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
#nova-root .neos-file-size{color:var(--muted);text-align:right;font-size:11px;white-space:nowrap}
#nova-root .neos-file-actions{display:flex;align-items:center;gap:4px;margin-right:4px}
#nova-root .neos-file-actions .neos-iconbtn{width:30px;height:30px;min-height:30px;border:0;background:transparent;color:var(--muted)}
#nova-root .neos-file-actions .neos-iconbtn:hover{color:var(--accent);background:var(--panel-3)}
#nova-root .neos-file-list.is-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;padding:12px}
#nova-root .neos-file-list.is-grid .neos-file-row{display:flex;flex-direction:column;align-items:stretch;background:var(--panel-3);padding:8px}
#nova-root .neos-file-list.is-grid .neos-file-main{display:flex;flex-direction:column;align-items:flex-start;min-height:120px}
#nova-root .neos-file-list.is-grid .neos-file-symbol{width:48px;height:48px}
#nova-root .neos-file-list.is-grid .neos-file-size{display:block;text-align:left}
#nova-root .neos-file-list.is-grid .neos-file-actions{align-self:flex-end}
#nova-root .neos-truncated{padding:12px 15px;color:var(--muted);border-top:1px solid var(--line)}
#nova-root .neos-truncated a{color:var(--accent)}

/* Preview inspector */
#nova-root .neos-preview{display:grid;grid-template-rows:auto minmax(0,1fr) auto}
#nova-root .neos-preview-head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 17px;border-bottom:1px solid var(--line);min-width:0;min-height:76px}
#nova-root .neos-preview-title{display:grid;gap:4px;min-width:0}
#nova-root .neos-preview-title small{font-size:9px;font-weight:760;letter-spacing:.13em;color:var(--accent)}
#nova-root .neos-preview-title strong{font-size:13px;font-weight:680;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nova-root .neos-preview-title>span{font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nova-root .neos-preview-actions{display:flex;gap:4px;align-items:center;flex-shrink:0}
#nova-root .neos-preview-actions .neos-iconbtn{width:32px;height:32px;min-height:32px;border:0;background:transparent;color:var(--muted)}
#nova-root .neos-preview-actions .neos-iconbtn:hover{background:var(--panel-3);color:var(--text)}
#nova-root .neos-preview-body{padding:16px;min-height:0;display:grid;place-items:center;overflow:auto}
#nova-root .neos-preview-foot{display:flex;justify-content:space-between;gap:12px;min-width:0;border-top:1px solid var(--line);padding:10px 16px;color:var(--muted);font-size:10px}
#nova-root .neos-preview-foot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nova-root .neos-preview-empty,#nova-root .neos-preview-loading,#nova-root .neos-browser-state{display:grid;justify-items:center;align-content:center;text-align:center;gap:10px;min-height:310px;color:var(--muted);padding:20px}
#nova-root .neos-preview-empty small{font-size:11px;opacity:.7}
#nova-root .neos-empty-symbol,#nova-root .neos-folder-emblem,#nova-root .neos-office-illustration{display:grid;place-items:center;width:70px;height:70px;border-radius:19px;color:var(--accent);background:var(--accent-soft);margin-bottom:4px}
#nova-root .neos-preview-loading{min-height:330px}
#nova-root .neos-image-preview{display:grid;place-items:center;width:100%;height:100%}
#nova-root .neos-image-preview img,#nova-root .neos-office-thumb{max-width:100%;max-height:62vh;object-fit:contain;border-radius:10px}
#nova-root .neos-text-preview{width:100%;max-height:64vh;margin:0;padding:17px 18px;background:rgba(5,12,27,.4);border:1px solid var(--line);border-radius:10px;overflow:auto;white-space:pre-wrap;font:12px/1.65 ui-monospace,Consolas,monospace;color:var(--text)}
#nova-root .neos-table-preview{width:100%;max-height:64vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
#nova-root .neos-table-preview table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:11px}
#nova-root .neos-table-preview th,#nova-root .neos-table-preview td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line)}
#nova-root .neos-table-preview th{position:sticky;top:0;background:var(--panel-3)}
#nova-root .neos-pdf-container{width:100%}
#nova-root .neos-pdf-preview{width:100%;height:64vh;background:#fff;border:0;border-radius:10px}
#nova-root .neos-folder-preview,#nova-root .neos-office-preview{display:grid;justify-items:center;align-content:center;gap:14px;min-height:360px;text-align:center;padding:18px}
#nova-root .neos-office-preview strong{font-size:14px}
#nova-root .neos-office-preview>span{color:var(--muted)}
#nova-root .neos-preview-meta{display:grid;gap:8px;min-width:0;width:100%}
#nova-root .neos-preview-meta span{color:var(--muted);font-size:11px}
#nova-root .neos-preview-meta code{display:block;padding:12px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel-3);word-break:break-all;white-space:pre-wrap;font-size:11px}
#nova-root .neos-spinner{display:inline-block;width:27px;height:27px;border:2px solid var(--line-strong);border-top-color:var(--accent);border-radius:50%;animation:neos-spin 1s linear infinite}

/* Secondary widgets */
#nova-root .neos-stat-main{font-size:clamp(24px,2.2vw,34px);font-weight:770;letter-spacing:-.055em;margin:10px 0}
#nova-root .neos-meter{width:100%;height:6px;border-radius:99px;overflow:hidden;background:var(--panel-3);margin:14px 0 8px}
#nova-root .neos-meter span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
#nova-root .neos-subtle{font-size:11px;color:var(--muted)}
#nova-root .neos-clock{font-size:clamp(26px,2.9vw,42px);font-weight:750;line-height:1.2;letter-spacing:-.055em;margin:8px 0}
#nova-root .neos-list{display:grid;gap:6px}
#nova-root .neos-item{display:flex;align-items:center;gap:11px;min-height:52px;width:100%;text-align:left;padding:10px;background:transparent;border:1px solid transparent;border-radius:10px;color:var(--text)}
#nova-root .neos-item:hover{background:var(--panel-2);border-color:var(--line)}
#nova-root .neos-item-icon{display:grid;place-items:center;width:33px;height:33px;border-radius:9px;background:var(--accent-soft);color:var(--accent);flex-shrink:0}
#nova-root .neos-item-title{display:grid;gap:4px;min-width:0;flex:1}
#nova-root .neos-item-title strong{font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nova-root .neos-item-title small{color:var(--muted);font-size:10px}
#nova-root .neos-item-meta{font-size:10px;color:var(--muted);white-space:nowrap}
#nova-root .neos-event-bar{width:3px;align-self:stretch;border-radius:99px}
#nova-root .neos-metric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
#nova-root .neos-metric{display:grid;gap:7px;padding:14px;border-radius:10px;background:var(--panel-2)}
#nova-root .neos-metric strong{font-size:25px;font-weight:750;line-height:1}
#nova-root .neos-metric span{font-size:10px;color:var(--muted)}
#nova-root .neos-note{width:100%;min-height:170px;resize:vertical;color:var(--text);background:var(--panel-2);border:1px solid var(--line);padding:14px;border-radius:10px}
#nova-root .neos-note-tools{display:flex;justify-content:flex-end;margin-top:10px}
#nova-root .neos-link-grid,#nova-root .neos-hub-links{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:9px}
#nova-root .neos-link-card{display:flex;align-items:center;gap:9px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);font-size:12px}
#nova-root .neos-link-card span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nova-root .neos-link-card:hover{border-color:var(--line-strong)}
#nova-root .neos-empty{display:grid;place-items:center;min-height:100px;padding:15px;color:var(--muted);font-size:12px}
#nova-root .neos-footer{display:flex;justify-content:space-between;padding:24px 3px;color:var(--muted);font-size:10px;letter-spacing:.06em}

/* App launcher: one catalogue, one configurable placement */
#nova-root .neos-hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
#nova-root .neos-hub-grid.is-compact{grid-template-columns:repeat(auto-fill,minmax(106px,1fr))}
#nova-root .neos-app{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:14px;min-height:136px;padding:15px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,var(--panel-2),var(--panel));transition:transform .23s,border-color .23s,background .23s,box-shadow .23s}
#nova-root .neos-app:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--app) 40%,var(--line));background:linear-gradient(180deg,var(--panel-3),var(--panel));box-shadow:0 16px 32px rgba(0,0,0,.18)}
#nova-root .neos-app-glyph{display:grid;place-items:center;width:47px;height:47px;border-radius:13px;background:color-mix(in srgb,var(--app) 11%,var(--panel));color:var(--app)}
#nova-root .neos-app-visual{display:block}
#nova-root .neos-app-tile{display:block;width:66px;height:66px;object-fit:contain;filter:drop-shadow(0 12px 22px rgba(0,0,0,.18))}
#nova-root .neos-app-meta{display:flex;flex-direction:column;gap:2px}
#nova-root .neos-app-meta small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#nova-root .neos-app-label{font-size:13px;font-weight:720}

/* Modal surfaces */
#nova-root .neos-overlay,#nova-root .neos-pop-layer,#nova-root .neos-fullscreen-overlay{position:fixed;inset:0;z-index:65;background:rgba(2,7,18,.65);display:grid;padding:20px;backdrop-filter:blur(7px)}
#nova-root .neos-overlay{place-items:stretch end;padding:0}
#nova-root .neos-editor{width:min(525px,100%);height:100%;max-height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--panel);border-left:1px solid var(--line);box-shadow:-14px 0 55px rgba(0,0,0,.34);overflow:hidden}
#nova-root .neos-editor-head,#nova-root .neos-editor-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:19px 23px;border-bottom:1px solid var(--line)}
#nova-root .neos-editor-head h2{font-size:18px;margin:0;font-weight:740}
#nova-root .neos-editor-foot{border-top:1px solid var(--line);border-bottom:0}
#nova-root .neos-editor-foot>div{display:flex;gap:8px;align-items:center}
#nova-root .neos-editor-foot>span{font-size:10px;color:var(--muted)}
#nova-root .neos-editor-body{padding:21px 23px 32px;overflow:auto;display:grid;align-content:start;gap:24px}
#nova-root .neos-editor-body section{display:grid;gap:12px}
#nova-root .neos-editor-body h3{font-size:12px;letter-spacing:.04em;font-weight:740;margin:0}
#nova-root .neos-choice-set{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:7px}
#nova-root .neos-choice,#nova-root .neos-check{display:flex;align-items:center;gap:9px;min-width:0;padding:10px 11px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:11px}
#nova-root .neos-choice:has(input:checked),#nova-root .neos-check:has(input:checked){border-color:color-mix(in srgb,var(--accent) 34%,var(--line));background:var(--accent-soft)}
#nova-root .neos-choice input,#nova-root .neos-check input{accent-color:var(--accent)}
#nova-root .neos-pref-list{display:grid;gap:2px}
#nova-root .neos-pref-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
#nova-root .neos-pref-row .neos-check{border:0;background:transparent;padding:6px}
#nova-root .neos-pref-tools{display:flex;gap:6px;align-items:center}
#nova-root .neos-pref-tools select{height:34px;min-width:72px;font-size:11px}
#nova-root .neos-pref-tools .neos-iconbtn{height:32px;width:32px;min-height:32px}
#nova-root .neos-app-picks,#nova-root .neos-custom-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#nova-root .neos-link-edit{grid-column:1/-1;display:grid;grid-template-columns:1fr 1.3fr auto;gap:8px}
#nova-root .neos-link-edit input{min-width:0;width:100%;height:38px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);color:var(--text)}
#nova-root .neos-pop-layer{place-items:start center;padding-top:min(10vh,84px)}
#nova-root .neos-hub-pop{display:grid;gap:16px;width:min(880px,100%);max-height:82vh;padding:22px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:19px;box-shadow:0 30px 110px rgba(0,0,0,.5)}
#nova-root .neos-hub-pop>header{display:flex;justify-content:space-between;gap:10px;align-items:center}
#nova-root .neos-hub-header-title{display:grid;gap:4px}
#nova-root .neos-hub-header-title strong{font-size:19px;font-weight:750}
#nova-root .neos-hub-header-title span{color:var(--muted);font-size:11px}
#nova-root .neos-hub-shell,#nova-root .neos-hub-main{display:grid;gap:18px}
#nova-root .neos-hub-links{padding-top:15px;border-top:1px solid var(--line)}
#nova-root .neos-context-overlay{place-items:center}
#nova-root .neos-context-menu{display:grid;gap:3px;min-width:280px;max-width:90vw;padding:9px;background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:0 20px 70px rgba(0,0,0,.4)}
#nova-root .neos-context-title{padding:10px 11px;color:var(--muted);font-size:11px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nova-root .neos-context-menu button,#nova-root .neos-context-menu a{display:flex;align-items:center;gap:10px;width:100%;padding:11px;border:0;border-radius:8px;background:transparent;color:var(--text);text-align:left;font-size:12px}
#nova-root .neos-context-menu .is-danger{color:#ff98ab}
#nova-root .neos-context-menu button:hover,#nova-root .neos-context-menu a:hover{background:var(--panel-3)}
#nova-root .neos-fullscreen-overlay{place-items:center}
#nova-root .neos-fullscreen-panel{width:min(1200px,100%);height:min(88vh,950px);display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 100px rgba(0,0,0,.48)}
#nova-root .neos-fullscreen-panel>header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line)}
#nova-root .neos-fullscreen-panel>header>div{display:flex;align-items:center;gap:8px}
#nova-root .neos-fullscreen-content{display:grid;padding:14px;overflow:auto;min-height:0}
#nova-root .neos-fullscreen-content .neos-preview{min-height:100%}
#nova-root .neos-toast{position:fixed;bottom:18px;right:22px;z-index:80;padding:12px 16px;border-radius:11px;background:var(--panel);border:1px solid var(--line);box-shadow:0 15px 40px rgba(0,0,0,.3)}
#nova-root .neos-toast-success{border-color:rgba(70,221,189,.3)}
#nova-root .neos-toast-error{border-color:rgba(255,97,125,.3)}

/* Responsive rules */
@media (max-width:1250px){
  #nova-root .neos-topbar{gap:12px}
  #nova-root .neos-launch-chip{padding:9px}
  #nova-root .neos-browser-main{grid-template-columns:1fr}
  #nova-root .neos-browser-list-wrap,#nova-root .neos-preview{min-height:390px}
  #nova-root .neos-file-list{max-height:420px}
  #nova-root .neos-preview-body{min-height:320px}
}
@media (max-width:960px){
  #nova-root .neos-card[data-size="3"],#nova-root .neos-card[data-size="4"],#nova-root .neos-card[data-size="6"],#nova-root .neos-card[data-size="8"]{grid-column:span 6}
  #nova-root .neos-topbar{grid-template-columns:auto 1fr auto}
  #nova-root .neos-launchbar{justify-content:flex-start}
  #nova-root .neos-launch-chip span{display:none}
  #nova-root .neos-hub-trigger span{display:none}
}
@media (max-width:700px){
  #nova-root .neos-shell{padding:10px 10px 26px}
  #nova-root .neos-topbar{min-height:60px;padding:9px 11px;border-radius:14px;grid-template-columns:1fr auto;gap:8px}
  #nova-root .neos-brand{min-width:0;gap:8px}
  #nova-root .neos-brand-mark{width:40px;height:40px;border-radius:12px}
  #nova-root .neos-brand strong{font-size:17px}
  #nova-root .neos-brand>div>span{font-size:8px}
  #nova-root .neos-launchbar{display:none}
  #nova-root .neos-top-actions{gap:5px}
  #nova-root .neos-header-readout{display:none}
  #nova-root .neos-btn{min-height:35px;padding:7px 10px}
  #nova-root .neos-iconbtn{width:35px;height:35px;min-height:35px}
  #nova-root .neos-btn-primary span{display:none}
  #nova-root .neos-grid-cards{grid-template-columns:minmax(0,1fr);gap:11px}
  #nova-root .neos-card[data-size]{grid-column:span 1}
  #nova-root .neos-card{padding:15px;border-radius:14px}
  #nova-root .neos-explorer{padding:0}
  #nova-root .neos-explorer .neos-card-head{padding:14px 15px}
  #nova-root .neos-explorer .neos-card-body{padding:12px}
  #nova-root .neos-browser-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  #nova-root .neos-search{grid-column:1/-1}
  #nova-root .neos-browser-actions select{min-width:0;width:100%}
  #nova-root .neos-browser-actions select:nth-of-type(2){grid-column:auto}
  #nova-root .neos-browser-actions>a{display:none}
  #nova-root .neos-browser-actions .neos-iconbtn{width:35px;height:35px;min-height:35px}
  #nova-root .neos-breadcrumb{flex-wrap:wrap}
  #nova-root .neos-browser-total{display:none}
  #nova-root .neos-browser-list-wrap,#nova-root .neos-preview{min-height:310px}
  #nova-root .neos-file-list{max-height:350px}
  #nova-root .neos-preview-body{min-height:280px}
  #nova-root .neos-list-caption{display:none}
  #nova-root .neos-file-main{grid-template-columns:36px minmax(0,1fr) 56px;gap:7px}
  #nova-root .neos-file-size{font-size:10px}
  #nova-root .neos-preview-title strong{max-width:165px}
  #nova-root .neos-preview-actions .neos-iconbtn{width:30px;height:30px;min-height:30px}
  #nova-root .neos-hub-grid,#nova-root .neos-hub-grid.is-compact{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  #nova-root .neos-app{min-height:108px;padding:12px;gap:14px}
  #nova-root .neos-app-glyph{width:42px;height:42px}
  #nova-root .neos-editor{width:100%;border-left:0}
  #nova-root .neos-editor-body{padding:17px}
  #nova-root .neos-editor-foot{padding:14px}
  #nova-root .neos-choice-set{grid-template-columns:repeat(2,minmax(0,1fr))}
  #nova-root .neos-pref-row{grid-template-columns:1fr;gap:4px}
  #nova-root .neos-pref-tools{justify-content:flex-end}
  #nova-root .neos-link-edit{grid-template-columns:1fr;gap:6px}
  #nova-root .neos-pop-layer,#nova-root .neos-fullscreen-overlay{padding:10px}
  #nova-root .neos-hub-pop{padding:15px;max-height:94vh}
  #nova-root .neos-fullscreen-panel{height:95vh}
}
@media (prefers-reduced-motion:reduce){
  #nova-root .neos-ambient-mesh,#nova-root .neos-ambient-beam,#nova-root .neos-ambient-aurora,#nova-root .neos-spinner{animation:none!important}
  #nova-root .neos-datafield{display:none!important}
  #nova-root .neos-card,#nova-root .neos-btn,#nova-root .neos-iconbtn,#nova-root .neos-launch-chip,#nova-root .neos-file-row,#nova-root .neos-app{transition:none!important}
}
@keyframes neos-spin{to{transform:rotate(360deg)}}
@keyframes neos-mesh{0%{transform:translate3d(0,0,0)}100%{transform:translate3d(3%, -2%,0)}}
@keyframes neos-beam{0%{transform:translateX(-6%)}100%{transform:translateX(6%)}}

/* NEOS 0.5 — Cyber Flat UI Kit integration. All rules scoped to Neos. */
#nova-root {
  --bg:#07111f;
  --panel:#0c192b;
  --panel-2:#112035;
  --panel-3:#172940;
  --line:#263d52;
  --line-strong:#375b70;
  --text:#f0f6ff;
  --muted:#9db2c6;
  --accent:#22ddd6;
  --accent-2:#a987fa;
  --accent-soft:rgba(34,221,214,.105);
  --radius:18px;
}
#nova-root.neos-light{
  --bg:#eaf1f9;--panel:#fff;--panel-2:#f4f8fc;--panel-3:#eaf1f9;
  --line:#cedae7;--line-strong:#a2bed0;--text:#16273d;--muted:#597089;
}
#nova-root[data-accent="cyan"]{--accent:#22ddd6;--accent-2:#a987fa;--accent-soft:rgba(34,221,214,.11)}
#nova-root .neos-shell{padding:15px clamp(14px,1.8vw,32px) 28px;}
#nova-root .neos-layout{max-width:1920px;}
#nova-root .neos-topbar{
  position:relative;top:auto;min-height:72px;margin-bottom:10px;
  background:rgba(5,16,32,.88);
  border:1px solid rgba(77,122,156,.38);
  border-radius:17px;
  display:grid;grid-template-columns:auto minmax(200px,1fr) auto;gap:20px;
  box-shadow:0 8px 26px rgba(1,8,20,.25),inset 0 1px 0 rgba(255,255,255,.035);
}
#nova-root .neos-topbar::after{content:"";position:absolute;bottom:-1px;left:16%;width:32%;height:1px;background:linear-gradient(90deg,transparent,rgba(44,218,220,.68),transparent);pointer-events:none;}
#nova-root .neos-brand{min-width:220px;max-width:260px;}
#nova-root .neos-brand-mark{width:235px;height:48px;border:0!important;border-radius:0;background:none!important;box-shadow:none!important;}
#nova-root .neos-brand-mark img{width:100%;height:100%;object-fit:contain;object-position:left center;}
#nova-root .neos-topsearch{display:flex;align-items:center;gap:12px;width:min(650px,100%);margin:0 auto;height:40px;background:#0d1b2d;border:1px solid #304c63;border-radius:11px;color:#98b3c9;padding:0 14px;font-size:13px;}
#nova-root .neos-topsearch span:nth-child(2){flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
#nova-root .neos-topsearch kbd{font-size:10px;border:1px solid #29465b;border-radius:5px;padding:2px 6px;}
#nova-root .neos-workspace-tabs{
  display:flex;gap:5px;min-height:58px;align-items:center;padding:7px 10px;margin-bottom:12px;
  border:1px solid rgba(77,122,156,.30);border-radius:17px;
  background:#0b1c2b url('../img/kit/panels/navigation-strip.svg') center center/100% 100% no-repeat;
  overflow:auto hidden;scrollbar-width:thin;
}
#nova-root .neos-workspace-tab{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;flex:1 0 auto;
  min-width:94px;max-width:190px;min-height:42px;padding:8px 14px;
  color:#afc2d3;border:1px solid transparent;border-radius:13px;background:transparent;
  font-size:13px;font-weight:660;white-space:nowrap;
  transition:background .22s ease,color .2s ease,border-color .2s ease,transform .2s ease,box-shadow .2s ease;
}
#nova-root .neos-workspace-tab img{width:22px;height:22px;object-fit:contain;}
#nova-root .neos-workspace-tab:hover{color:#f0f6ff;background:rgba(26,52,77,.7);transform:translateY(-1px);}
#nova-root .neos-workspace-tab.is-active{color:#ecfffd;background:linear-gradient(180deg,rgba(13,90,100,.65),rgba(13,65,78,.8));border-color:rgba(34,221,214,.72);box-shadow:0 0 0 1px rgba(34,221,214,.04),0 8px 20px rgba(0,146,156,.11);}
#nova-root .neos-hero{
  position:relative;display:flex;align-items:center;justify-content:space-between;gap:18px;
  min-height:94px;padding:16px clamp(18px,2vw,30px);margin-bottom:14px;
  border:1px solid rgba(57,179,174,.4);border-radius:18px;overflow:hidden;
  background:#0b1e2b url('../img/kit/panels/heading-cyber.svg') center center/100% 100% no-repeat;
}
#nova-root .neos-hero-head{z-index:1;min-width:0;}
#nova-root .neos-hero-eyebrow{color:#20d8cb;font-size:10px;font-weight:800;letter-spacing:.16em;}
#nova-root .neos-hero-eyebrow span{color:#d9a15d;margin:0 4px;}
#nova-root .neos-hero h1{margin:4px 0 0;font-size:clamp(22px,2.5vw,34px);line-height:1.12;font-weight:780;letter-spacing:-.04em;}

/* Neos 0.5.1 — Home/Files separation, lightweight app icons, slide workspaces */
#nova-root {
  overflow-y:auto!important;
  overflow-x:hidden!important;
  overscroll-behavior-y:contain;
  touch-action:pan-y;
  scrollbar-gutter:stable;
}
#nova-root #neos-surface { display:block; min-height:100%; }
#nova-root .neos-shell {min-height:100%; padding-bottom:56px; overflow:visible;}
#nova-root .neos-layout {min-height:100%;}
#nova-root .neos-workspace-stage {min-width:0; min-height:310px; position:relative; transform-origin:center center;}
#nova-root .neos-workspace-tabs {position:relative; z-index:2;}
#nova-root .neos-workspace-tab {position:relative; isolation:isolate;}
#nova-root .neos-workspace-tab::after {content:"";position:absolute;bottom:4px;left:22%;right:22%;height:2px;border-radius:99px;background:linear-gradient(90deg,transparent,#24e6df,transparent);opacity:0;transform:scaleX(.4);transition:opacity .28s ease,transform .32s cubic-bezier(.16,1,.3,1);}
#nova-root .neos-workspace-tab.is-active::after {opacity:1;transform:scaleX(1);}
#nova-root .neos-home-grid .neos-card {align-self:start;}
#nova-root .neos-home-files-head {display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:3px 0 12px;border-bottom:1px solid var(--line);}
#nova-root .neos-home-file-stats {display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;}
#nova-root .neos-home-file-stats strong {font-size:22px;line-height:1;color:var(--text);font-variant-numeric:tabular-nums;}
#nova-root .neos-home-pins {display:flex;gap:8px;flex-wrap:wrap;padding:11px 0;}
#nova-root .neos-home-pins button {display:flex;gap:8px;align-items:center;background:var(--panel-2);border:1px solid var(--line);padding:8px 11px;border-radius:10px;color:var(--text);}
#nova-root .neos-home-pins button:hover {border-color:var(--accent);background:var(--panel-3);}

#nova-root .neos-home-file {display:flex;align-items:center;gap:10px;padding:13px 11px;background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:11px;text-align:left;min-width:0;transition:background .2s ease,border-color .2s ease,transform .2s ease;}
#nova-root .neos-home-file:hover {background:var(--panel-3);border-color:rgba(34,221,214,.45);transform:translateY(-2px);}
#nova-root .neos-home-file>span {display:grid;place-items:center;flex:0 0 32px;width:32px;height:32px;background:var(--accent-soft);border-radius:8px;color:var(--accent);}

  position:relative;min-height:108px;padding:10px 8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:transparent!important;border:1px solid transparent!important;box-shadow:none!important;

#nova-root .neos-cal-day{display:flex;flex-direction:column;gap:7px;min-width:0;min-height:111px;padding:8px;border-radius:11px;background:linear-gradient(145deg,rgba(33,58,87,.56),rgba(13,24,45,.56));border:1px solid var(--line);transition:border-color .16s,background .16s}
#nova-root .neos-cal-day.is-today{border-color:color-mix(in srgb,var(--accent) 60%,var(--line));background:linear-gradient(145deg,rgba(25,93,118,.46),rgba(13,25,52,.65))}
#nova-root .neos-cal-day.is-other{opacity:.52}
#nova-root .neos-cal-day:hover{border-color:var(--accent)}
#nova-root .neos-cal-day-number{align-self:flex-start;display:flex;align-items:center;gap:8px;max-width:100%;min-width:26px;border:0;border-radius:9px;background:transparent;color:var(--text);padding:2px 6px;font-size:12px;font-weight:800;cursor:pointer}
#nova-root .neos-cal-day-number:hover,#nova-root .neos-cal-day-number:focus-visible{background:var(--accent-soft);outline:1px solid var(--accent)}
#nova-root .neos-cal-today-label{color:var(--accent);font-size:10px;font-weight:650}
#nova-root .neos-cal-events{display:grid;gap:4px;align-content:start;min-width:0}
#nova-root .neos-cal-event{display:block;text-align:left;min-width:0;width:100%;border:1px solid rgba(58,193,218,.24);border-left:3px solid var(--accent);border-radius:5px;padding:5px 6px;background:rgba(27,104,125,.24);color:var(--text);cursor:pointer;font:inherit;font-size:11px;line-height:1.35}
#nova-root .neos-cal-event:hover,#nova-root .neos-cal-event:focus-visible{border-color:var(--accent);background:var(--accent-soft)}
#nova-root .neos-cal-event span{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nova-root .neos-cal-event small{display:block;font-size:10px;color:var(--muted);margin-top:3px}
#nova-root .neos-cal-more{color:var(--muted);font-size:10px}
#nova-root .neos-calendar-grid.is-week .neos-cal-day{min-height:225px}
#nova-root .neos-calendar-grid.is-week .neos-cal-day-number{font-size:14px}
#nova-root .neos-cal-detail{display:grid;gap:16px;min-width:0}
#nova-root .neos-cal-detail>div{display:grid;gap:4px}
#nova-root .neos-cal-detail>div>span{font-size:11px;color:var(--muted)}
#nova-root .neos-cal-detail>div>strong{font-size:14px;overflow-wrap:anywhere}
#nova-root .neos-cal-detail>p{font-size:13px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid var(--line);padding-top:14px;margin:0}
#nova-root .neos-gw-info{display:grid;gap:8px;max-width:700px;margin:20px auto;padding:19px;border:1px solid var(--line-strong);border-radius:14px;background:var(--panel-2);color:var(--text)}
#nova-root .neos-gw-info strong{color:var(--accent)}
#nova-root .neos-gw-info p{font-size:12px;line-height:1.65;color:var(--muted);margin:0}
#nova-root .neos-gw-info-inline{margin:10px 0 14px;padding:10px 14px;font-size:11px;line-height:1.5;color:var(--muted)}
#nova-root .neos-gw-warning{border:1px solid rgba(249,166,76,.4);border-radius:10px;padding:10px;color:#ffd3a1;font-size:12px}
#nova-root .neos-task-filters{margin:0 0 16px}
@media(max-width:760px){
  #nova-root .neos-calendar-grid{gap:3px}
  #nova-root .neos-cal-day{min-height:92px;padding:4px;gap:3px;border-radius:6px}
  #nova-root .neos-cal-day-number{padding:3px;font-size:11px}
  #nova-root .neos-cal-today-label{display:none}
  #nova-root .neos-cal-event{font-size:9px;padding:3px 2px;border-left-width:2px}
  #nova-root .neos-cal-event small{display:none}
  #nova-root .neos-cal-weekday{font-size:9px;letter-spacing:0;padding:3px}

  #nova-root .neos-calendar-nav>strong{font-size:14px;margin-left:2px}
  #nova-root .neos-calendar-toolbar{gap:10px}
}
@media(max-width:390px){
  #nova-root .neos-calendar-grid{gap:2px}
  #nova-root .neos-cal-day{min-height:83px;padding:3px}

}
@media(prefers-reduced-motion:reduce){#nova-root .neos-cal-day{transition:none}}

  function planningItems(){

      if(task.done||!task.due)continue;

      items.push({kind:'task',date:date<start?start:date,overdue:date<start,title:task.title,subtitle:task.calendar,href:task.href});
    }
    for(const card of planningDeck.cards){
      if(card.done||!card.due)continue;
      const date=new Date(card.due);if(!Number.isFinite(date.getTime())||date>=end)continue;

    if(!Number.isFinite(date.getTime()))throw new Error('Date invalide');
    return date.toISOString();
  }
  function deckCardPayload(card,{title,description,duedate,done,order}){
    return {
      title,description,type:card?.type||'plain',owner:card?.owner||root.dataset.currentUid||'',
      order:Number.isFinite(Number(order))?Number(order):999,
      duedate:duedate||null,archived:!!card?.archived,done:done||null,
    };
  }
  function deckNextOrder(stack){
    return Math.max(0,...(stack?.cards||[]).map(card=>Number(card.order)||0))+1;
  }
  function deckCardApiPath(boardId,stackId,cardId){
    return `/boards/${encodeURIComponent(boardId)}/stacks/${encodeURIComponent(stackId)}/cards/${encodeURIComponent(cardId)}`;
  }
  function deckCardPath(){
    return deckCardApiPath(deckCardEditor.boardId,deckCardEditor.stackId,deckCardEditor.cardId);
  }
  function deckCreateCard(stackId){
    if(deckMoveBusy||!deckState.boardId)return;
    Object.assign(deckCardEditor,{boardId:deckState.boardId,stackId,cardId:null,card:{title:'',description:'',duedate:null,done:null,type:'plain'},create:true,draftStackId:String(stackId),loading:false,loadFailed:false,saving:false,error:'',dirty:false});

  }
  async function openDeckCard(stackId,cardId){
    if(deckMoveBusy)return;
    const stack=deckState.stacks.find(x=>String(x.id)===String(stackId));
    const summary=stack?.cards?.find(x=>String(x.id)===String(cardId));if(!summary)return;
    Object.assign(deckCardEditor,{boardId:deckState.boardId,stackId,cardId,card:{...summary},create:false,draftStackId:String(stackId),loading:!demo,loadFailed:false,saving:false,error:'',dirty:false});
    popMode='deck-card';renderDeckCardEditor();
    if(demo)return;
    try{
      const details=await deckRequest(deckCardPath());
      if(popMode!=='deck-card'||String(deckCardEditor.cardId)!==String(cardId))return;
      deckCardEditor.card={...summary,...details};deckCardEditor.loading=false;renderDeckCardEditor();
    }catch(e){if(popMode!=='deck-card')return;deckCardEditor.loading=false;deckCardEditor.loadFailed=true;deckCardEditor.error=`Détails indisponibles (${e.message}). Pour protéger les autres champs, l'édition est bloquée.`;renderDeckCardEditor();}
  }
  function renderDeckCardEditor(){
    if(popMode!=='deck-card')return;
    const card=deckCardEditor.card||{};
    const busy=deckCardEditor.loading||deckCardEditor.saving||deckCardEditor.loadFailed;
    const isCreate=deckCardEditor.create;
    const stackOptions=deckState.stacks.map(stack=>`<option value="${esc(stack.id)}" ${String(stack.id)===String(deckCardEditor.draftStackId||deckCardEditor.stackId)?'selected':''}>${esc(stack.title)}</option>`).join('');
    const dateValue=card.duedate?String(card.duedate).slice(0,10):'';
    popHost.innerHTML=`<div class="neos-pop-layer" data-action="close-pop"><section class="neos-deck-dialog neos-framed" role="dialog" aria-modal="true" aria-label="${isCreate?'Créer une carte Deck':'Modifier une carte Deck'}"><header><div><small>DECK · ${isCreate?'NOUVELLE CARTE':'CARTE'}</small><h2>${isCreate?'Créer une carte':'Éditer la carte'}</h2></div><button type="button" class="neos-iconbtn" data-action="deck-card-close" aria-label="Fermer">${icon('close',18)}</button></header>${deckCardEditor.loading?'<div class="neos-module-loader"><span class="neos-spinner"></span>Chargement des détails…</div>':`<div class="neos-deck-fields">${deckCardEditor.error?`<p class="neos-deck-error" role="alert">${esc(deckCardEditor.error)}</p>`:''}<label>Titre<input data-deck-title maxlength="255" value="${esc(card.title||'')}" ${busy?'disabled':''} placeholder="Titre de la carte"></label><label>Colonne<select data-deck-stack ${busy?'disabled':''}>${stackOptions}</select></label><label>Description (Markdown)<textarea data-deck-description rows="6" maxlength="30000" ${busy?'disabled':''} placeholder="Détails, liens, étapes…">${esc(card.description||'')}</textarea></label><label>Échéance (facultative)<input data-deck-duedate type="date" value="${esc(dateValue)}" ${busy?'disabled':''}></label>${!isCreate?`<label class="neos-deck-check"><input data-deck-done type="checkbox" ${card.done?'checked':''} ${busy?'disabled':''}><span>Carte terminée</span></label>`:''}<small>Les changements sont enregistrés dans Deck. Les déplacements sont vérifiés après synchronisation.</small></div>`}<footer><button type="button" class="neos-btn" data-action="deck-card-close">Annuler</button><button type="button" class="neos-btn neos-btn-primary" data-action="deck-card-save" ${busy?'disabled':''}>${icon('check',16)} ${deckCardEditor.saving?'Enregistrement…':isCreate?'Créer la carte':'Enregistrer'}</button></footer></section></div>`;
    if(!busy)popHost.querySelector('[data-deck-title]')?.focus();
  }
  async function deckCheckStack(boardId,cardId,targetStackId){
    await loadDeckStacks(boardId);
    return !!deckState.stacks.find(stack=>String(stack.id)===String(targetStackId))?.cards?.some(card=>String(card.id)===String(cardId));
  }
  async function deckPersistMove({boardId,sourceStackId,targetStackId,cardId,details,payload}){
    // Deck API versions differ in how they handle the stackId in the route.
    // Never report a move as successful without refetching the target stack.
    const targetPath=deckCardApiPath(boardId,targetStackId,cardId);
    let firstError=null;
    try{
      await deckRequest(targetPath,{method:'PUT',body:JSON.stringify(payload)});
      if(await deckCheckStack(boardId,cardId,targetStackId))return;
    }catch(e){firstError=e;}
    // Fallback: documented reorder route using the *target* in both route/body.
    try{
      await deckRequest(`${targetPath}/reorder`,{method:'PUT',body:JSON.stringify({order:payload.order,stackId:Number(targetStackId)})});
      if(await deckCheckStack(boardId,cardId,targetStackId))return;
    }catch(e){firstError=e;}
    await loadDeckStacks(boardId);
    throw new Error(`déplacement non confirmé${firstError?` (${firstError.message})`:''}. Essaie depuis Deck natif.`);
  }
  async function moveDeckCard(sourceStackId,cardId,targetStackId){
    if(deckMoveBusy||String(sourceStackId)===String(targetStackId))return;
    const boardId=deckState.boardId;
    const source=deckState.stacks.find(x=>String(x.id)===String(sourceStackId));
    const target=deckState.stacks.find(x=>String(x.id)===String(targetStackId));
    const card=source?.cards?.find(x=>String(x.id)===String(cardId));
    if(!source||!target||!card||!boardId)return;
    deckMoveBusy=true;
    try{
      if(demo){source.cards=source.cards.filter(x=>String(x.id)!==String(cardId));target.cards.push({...card,stackId:target.id});render();}
      else{
        const details=await deckRequest(deckCardApiPath(boardId,sourceStackId,cardId));
        const payload=deckCardPayload(details,{title:details.title,description:details.description||'',duedate:details.duedate,done:details.done,order:deckNextOrder(target)});
        await deckPersistMove({boardId,sourceStackId,targetStackId,cardId,details,payload});
      }
      toast(`Carte déplacée vers « ${target.title} »`,'success');
    }catch(e){toast(`Déplacement impossible : ${e.message}`,'error');if(!demo)void loadDeckStacks(boardId);}
    finally{deckMoveBusy=false;deckDrag=null;}
  }
  async function saveDeckCard(){
    if(deckCardEditor.loading||deckCardEditor.saving||deckCardEditor.loadFailed)return;
    const title=popHost.querySelector('[data-deck-title]')?.value.trim()||'';
    const description=popHost.querySelector('[data-deck-description]')?.value||'';
    const targetStackId=popHost.querySelector('[data-deck-stack]')?.value||String(deckCardEditor.stackId);
    const duedateInput=popHost.querySelector('[data-deck-duedate]')?.value||'';
    const doneInput=popHost.querySelector('[data-deck-done]')?.checked||false;
    if(!title){toast('Titre requis','error');return;}
    const target=deckState.stacks.find(x=>String(x.id)===String(targetStackId));
    if(!target){toast('Colonne introuvable','error');return;}
    const original=deckCardEditor.card||{};
    const isCreate=deckCardEditor.create;
    const boardId=deckCardEditor.boardId;
    const sourceStackId=deckCardEditor.stackId;
    deckCardEditor.saving=true;deckCardEditor.error='';
    try{
      const duedate=deckDateFromInput(duedateInput,original.duedate);
      const done=isCreate?null:doneInput?(original.done||new Date().toISOString()):null;
      const moved=!isCreate&&String(sourceStackId)!==String(targetStackId);
      const payload=deckCardPayload(original,{title,description,duedate,done,order:moved?deckNextOrder(target):original.order||999});
      if(isCreate){
        if(demo){const card={id:Date.now(),...payload,stackId:Number(targetStackId)};target.cards.push(card);}
        else await deckRequest(`/boards/${encodeURIComponent(boardId)}/stacks/${encodeURIComponent(targetStackId)}/cards`,{method:'POST',body:JSON.stringify({title,description,type:'plain',order:deckNextOrder(target),duedate})});
      }else if(moved){
        if(demo){const source=deckState.stacks.find(x=>String(x.id)===String(sourceStackId));source.cards=source.cards.filter(x=>String(x.id)!==String(deckCardEditor.cardId));target.cards.push({...original,...payload,stackId:Number(targetStackId)});}
        else await deckPersistMove({boardId,sourceStackId,targetStackId,cardId:deckCardEditor.cardId,details:original,payload});
      }else{
        if(!demo)await deckRequest(deckCardPath(),{method:'PUT',body:JSON.stringify(payload)});
        const stack=deckState.stacks.find(x=>String(x.id)===String(sourceStackId));
        const card=stack?.cards?.find(x=>String(x.id)===String(deckCardEditor.cardId));if(card)Object.assign(card,payload);
      }
      deckCardEditor.saving=false;popMode='';popHost.replaceChildren();
      if(!demo)await loadDeckStacks(boardId);else render();
      toast(isCreate?'Carte créée':moved?'Carte déplacée':'Carte mise à jour','success');
    }catch(e){
      deckCardEditor.saving=false;deckCardEditor.draftStackId=String(targetStackId);
      deckCardEditor.card={...original,title,description,duedate:duedateInput?deckDateFromInput(duedateInput,original.duedate):null,done:doneInput?(original.done||new Date().toISOString()):null};
      deckCardEditor.error=`Enregistrement refusé (${e.message}). Vérifie les permissions Deck.`;renderDeckCardEditor();
    }
  }

  async function chooseWorkspace(id){
    if(!installedTabs().includes(id))return;
    if(id===activeWorkspace)return;
    if(notesState.dirty&&activeWorkspace==='notes'&&!window.confirm('Abandonner les modifications non enregistrées ?'))return;
    const old=activeWorkspace;
    const sequence=++transitionSequence;
    const direction=installedTabs().indexOf(id)>=installedTabs().indexOf(old)?1:-1;
    const stage=surface.querySelector('#neos-workspace-stage');
    workspaceScroll.set(old,root.scrollTop);
    if(motionEnabled()&&stage?.animate){
      try{
        const exit=stage.animate([{opacity:1,transform:'translate3d(0,0,0)',filter:'blur(0)'},{opacity:.07,transform:`translate3d(${-direction*24}px,0,0)`,filter:'blur(2px)'}],{duration:Math.round(160*motionFactor()),easing:'cubic-bezier(.4,0,1,1)',fill:'forwards'});
        await exit.finished;
      }catch(error){ /* interrupted by a newer navigation */ }
    }
    if(sequence!==transitionSequence)return;
    ++moduleGeneration;
    activeWorkspace=id;
    render();
    root.scrollTop=workspaceScroll.get(id)||0;
    surface.querySelectorAll('[data-action="workspace"]').forEach(el=>{
      if(el.dataset.workspace===id)el.setAttribute('aria-current','page');
    });
    if(motionEnabled()){
      const incoming=surface.querySelector('#neos-workspace-stage');
      incoming?.animate?.([{opacity:0,transform:`translate3d(${direction*28}px,0,0)`,filter:'blur(3px)'},{opacity:1,transform:'translate3d(0,0,0)',filter:'blur(0)'}],{duration:Math.round(410*motionFactor()),easing:'cubic-bezier(.16,1,.3,1)'});
      animateIn(surface.querySelectorAll('#neos-workspace-stage .neos-card, #neos-workspace-stage .neos-module'),40,65);
    }
    if(id==='photos'&&photoState.status==='idle')void loadPhotos();
    if(id==='notes'&&notesState.status==='idle')void loadNotes();
    if(id==='deck'&&deckState.status==='idle')void loadDeck();
    if((id==='calendar'||id==='tasks'||id==='planning')&&groupware.status==='idle')void loadGroupware();
    if(id==='planning')void loadPlanningDeck();
  }

  function toggleFileSelection(path,shift=false,force=null){
    if(fileBusy)return;
    const entries=visibleFileEntries(), current=entries.findIndex(x=>x.path===path);
    if(current<0)return;
    if(shift&&fileAnchorPath){
      const anchor=entries.findIndex(x=>x.path===fileAnchorPath);
      if(anchor>=0){const a=Math.min(anchor,current),b=Math.max(anchor,current);entries.slice(a,b+1).forEach(x=>fileSelection.add(x.path));}
      else fileSelection.add(path);
    }else{
      if(force===true)fileSelection.add(path);
      else if(force===false)fileSelection.delete(path);
      else if(fileSelection.has(path))fileSelection.delete(path);
      else fileSelection.add(path);
    }
    fileAnchorPath=path;
    refreshSelectionDisplay();
  }
  function selectAllFiles(){
    if(fileBusy)return;
    const entries=visibleFileEntries();
    const allSelected=entries.every(x=>fileSelection.has(x.path));

  }

  // Dense 12-column grid. The cards are measured by their content and assigned
  // short implicit rows, so a tall widget no longer stretches an entire row.
  function scheduleMasonry(){
    if(masonryFrame)cancelAnimationFrame(masonryFrame);
    masonryFrame=requestAnimationFrame(()=>{masonryFrame=0;layoutMasonry();});
  }
  function layoutMasonry(){
    const grid=surface.querySelector('.neos-home-grid');if(!grid)return;
    const cards=[...grid.querySelectorAll(':scope > .neos-card')];
    const narrow=window.matchMedia('(max-width:700px)').matches;
    if(narrow){
      cards.forEach(card=>{card.style.gridRowEnd='auto';card.style.minHeight='';});
      return;
    }
    const style=getComputedStyle(grid);const rowHeight=Number.parseFloat(style.gridAutoRows)||8;
    const rowGap=Number.parseFloat(style.rowGap)||14;
    const pxPerRow=rowHeight+rowGap;
    for(const card of cards){
      // Measure content rather than the stretched grid slot.
      card.style.gridRowEnd='span 1';
      card.style.minHeight='';
      const head=card.querySelector(':scope > .neos-card-head');
      const body=card.querySelector(':scope > .neos-card-body');
      const cs=getComputedStyle(card);
      const marginHead=head?Number.parseFloat(getComputedStyle(head).marginBottom)||0:0;
      const natural=(head?.scrollHeight||0)+(body?.scrollHeight||0)+marginHead+
        (Number.parseFloat(cs.paddingTop)||0)+(Number.parseFloat(cs.paddingBottom)||0)+2;
      const chosen=widgetMinHeight(card.dataset.widget);
      const height=Math.max(natural, chosen, 112);
      const rows=Math.max(1,Math.ceil((height+rowGap)/pxPerRow));
      card.style.gridRowEnd=`span ${rows}`;
      card.style.minHeight=`${height}px`;
    }
  }

  function updateClock() {
    const date = new Date();
    surface.querySelectorAll('[data-clock]').forEach(el => el.textContent = new Intl.DateTimeFormat('fr-FR',{hour:'2-digit',minute:'2-digit'}).format(date));
    surface.querySelectorAll('[data-clock-date]').forEach(el => el.textContent = new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(date));
    const minuteAngle=(date.getMinutes()+date.getSeconds()/60)*6;
    const hourAngle=(date.getHours()%12+date.getMinutes()/60)*30;
    surface.querySelectorAll('[data-holo-minute]').forEach(el=>el.style.transform=`rotate(${minuteAngle}deg)`);
    surface.querySelectorAll('[data-holo-hour]').forEach(el=>el.style.transform=`rotate(${hourAngle}deg)`);
  }

  async function browse(path, resetQuery=true, recordHistory=true) {
    if (!path || !path.startsWith('/') || path.includes('\\') || path.split('/').slice(1).some(x=>x==='..'||x==='.')) return;
    ++previewGeneration;

  function parseDelimited(text,delimiter){
    const rows=[];let row=[],cell='',quoted=false;
    for(let i=0;i<text.length&&rows.length<60;i++){

      if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}
      else if(c===delimiter&&!quoted){row.push(cell);cell='';}
      else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row.slice(0,20));row=[];cell='';}

    if(row.length||cell){row.push(cell);rows.push(row.slice(0,20));}

  async function transferFiles(entries,targetFolder,mode){
    if(fileBusy||!entries?.length)return;
    if(demo){toast('Opération désactivée dans l’aperçu','error');return;}
    const targetBase=davFolderUrl(targetFolder);
    if(!targetBase){toast('Dossier de destination inaccessible','error');return;}
    const operations=entries.filter(x=>x&&x.davUrl&&x.path&&x.name);
    if(!operations.length)return;
    // Prevent drag/move of a folder into itself or a descendant, and do not
    // silently turn a no-op move to the same folder into a destructive action.
    if(operations.some(x=>x.kind==='folder'&&sameOrChild(targetFolder,x.path))){toast('Impossible de déplacer/copier un dossier dans lui-même ou un sous-dossier','error');return;}
    const moving=mode==='cut',method=moving?'MOVE':'COPY';
    busyFiles(true);let done=0,conflicts=0,errors=0;
    const failed=[];
    for(const entry of operations){
      const sourceFolder=entry.path.slice(0,entry.path.lastIndexOf('/'))||'/';

      let success=false,conflict=false;

        const name=attempt===0&&sourceFolder!==targetFolder?entry.name:filenameCopyName(entry.name,sourceFolder===targetFolder?attempt+1:attempt);
        const destination=new URL(davJoin(targetBase,name),window.location.href);
        if(destination.origin!==window.location.origin){errors++;break;}
        try{
          await davRequest(method,entry.davUrl,{headers:{Destination:destination.href,Overwrite:'F'}});

        }catch(error){

        }

      if(!failed.length)fileClipboard.mode='';
    }
    busyFiles(false);fileSelection.clear();fileAnchorPath='';
    summarizeFiles(moving?'Déplacement':'Copie',done,conflicts,errors);

  }

  function encodeSettings() {
    const form = new URLSearchParams();
    const put = (key, value) => form.append(`settings[${key}]`, String(value));
    ['theme','density','accent','layout','motion','launcherMode','gridMode','notes'].forEach(key => put(key, settings[key] || ''));
    settings.order.forEach((v,i) => form.append(`settings[order][${i}]`, v));
    settings.hidden.forEach((v,i) => form.append(`settings[hidden][${i}]`, v));
    Object.entries(settings.sizes || {}).forEach(([id,v]) => form.append(`settings[sizes][${id}]`, String(v)));
    Object.entries(settings.heights || {}).forEach(([id,v]) => form.append(`settings[heights][${id}]`, String(v)));
    (settings.links || []).forEach((l,i) => { form.append(`settings[links][${i}][title]`, l.title); form.append(`settings[links][${i}][url]`, l.url); });
    (settings.pins || []).forEach((p,i) => form.append(`settings[pins][${i}]`, p));
    (settings.topApps || []).forEach((id,i) => form.append(`settings[topApps][${i}]`, id));
    return form;
  }

  async function save() {
    if (saving) return;
    saving = true;
    while (saveQueued) {
      saveQueued = false;
      updateSaveIndicator('Enregistrement…');
      try {
        await api(root.dataset.settingsUrl, { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'}, body:encodeSettings().toString() });
        updateSaveIndicator('Enregistré');
      } catch (error) {
        console.error('[Neos] sauvegarde impossible', error);
        updateSaveIndicator('Erreur');
        toast('Impossible d’enregistrer.', 'error');
        break;
      }
    }
    saving = false;
  }

  function queueSave() { if(demo){ updateSaveIndicator('Démo — réglages temporaires'); return; } saveQueued = true; if (!saving) void save(); }

  // Favorite state is stored by Nextcloud via WebDAV oc:favorite (not in Neos
  // preferences). Recently opened paths are only stored locally in this browser
  // under a per-user key; no file content is retained.
  function recentStorageKey(){
    const uid=root.dataset.currentUid||'demo';
    return `neos-v060-recent:${uid}`;
  }
  function readRecent(){
    recentViewed.splice(0);
    try{
      const value=JSON.parse(localStorage.getItem(recentStorageKey())||'[]');
      if(Array.isArray(value))for(const item of value.slice(0,24)){
        if(validFileFolderPath(item?.path)&&item.path!=='/'&&typeof item.name==='string'&&item.name.length<300){
          recentViewed.push({name:item.name,path:item.path,parent:item.path.slice(0,item.path.lastIndexOf('/'))||'/',kind:'file',size:number(item.size),mime:String(item.mime||''),mtime:number(item.mtime),openedAt:number(item.openedAt)});
        }
      }
    }catch{/* Storage may be blocked by the browser */}
  }
  function recordRecent(entry){
    if(!entry?.path||entry.kind!=='file'||!validFileFolderPath(entry.path))return;
    const current={name:entry.name,path:entry.path,parent:entry.path.slice(0,entry.path.lastIndexOf('/'))||'/',kind:'file',size:number(entry.size),mime:String(entry.mime||''),mtime:number(entry.mtime),openedAt:Date.now()};
    const idx=recentViewed.findIndex(item=>item.path===entry.path);
    if(idx!==-1)recentViewed.splice(idx,1);
    recentViewed.unshift(current);recentViewed.length=Math.min(recentViewed.length,24);
    try{localStorage.setItem(recentStorageKey(),JSON.stringify(recentViewed));}catch{/* History remains available for this page */}
  }
  function favoriteDavRoot(){
    const uid=root.dataset.currentUid;
    if(uid){
      // The webroot is supplied by Nextcloud itself. Never derive it from
      // the overview route: pretty routes do not contain '/index.php/'.
      const webroot=String(root.dataset.webroot ?? window.OC?.getRootPath?.() ?? '');
      if(webroot&&!webroot.startsWith('/'))return '';
      return window.location.origin+webroot.replace(/\/+$/,'')+'/remote.php/dav/files/'+encodeURIComponent(uid);
    }
    return davRoot();
  }
  function favoriteDavUrl(path){
    if(!validFileFolderPath(path)||path==='/')return '';
    const base=favoriteDavRoot();
    return base?base+path.split('/').slice(1).map(encodeURIComponent).reduce((a,b)=>a+'/'+b,''):'';
  }
  function xmlNodeValue(node,namespace,name){
    return node?.getElementsByTagNameNS(namespace,name)?.[0]?.textContent||'';
  }
  function parseFavoriteXml(xml,base){
    const doc=new DOMParser().parseFromString(xml,'application/xml');
    if(doc.getElementsByTagName('parsererror').length)throw Error('Réponse WebDAV invalide');
    const rootPath=new URL(base,window.location.href).pathname.replace(/\/+$/,'');
    const results=[];
    for(const entry of doc.getElementsByTagNameNS('DAV:','response')){
      const href=xmlNodeValue(entry,'DAV:','href');if(!href)continue;
      const url=new URL(href,window.location.origin);
      const pathname=url.pathname.replace(/\/+$/,'');
      if(url.origin!==window.location.origin||!pathname.startsWith(rootPath+'/'))continue;
      const segments=pathname.slice(rootPath.length+1).split('/').map(x=>decodeURIComponent(x));
      const path='/'+segments.join('/');
      if(!validFileFolderPath(path))continue;
      const collection=entry.getElementsByTagNameNS('DAV:','collection').length>0;
      const name=segments.at(-1);
      const mime=collection?'httpd/unix-directory':xmlNodeValue(entry,'DAV:','getcontenttype');
      const mtime=Math.floor(Date.parse(xmlNodeValue(entry,'DAV:','getlastmodified'))/1000)||0;
      const size=Number(xmlNodeValue(entry,'DAV:','getcontentlength')||xmlNodeValue(entry,'http://owncloud.org/ns','size'))||0;
      results.push({name,path,parent:path.slice(0,path.lastIndexOf('/'))||'/',kind:collection?'folder':'file',mime,size:collection?null:size,mtime,davUrl:url.pathname});
    }
    return results.slice(0,100);
  }
  async function loadFavorites(){
    if(favoriteState.status==='loading')return;
    favoriteState.status='loading';favoriteState.error='';renderGlobalSearchResults();
    try{
      let entries;
      if(demo){
        const browseItems=Object.values(demo.browse||{}).flatMap(x=>x.items||[]);
        entries=browseItems.filter(x=>favoritePaths.has(x.path)).map(x=>({...x,parent:x.path.slice(0,x.path.lastIndexOf('/'))||'/'}));
      }else{
        const base=favoriteDavRoot();if(!base)throw Error('Racine WebDAV inconnue');
        const body='<?xml version="1.0"?><oc:filter-files xmlns:oc="http://owncloud.org/ns" xmlns:d="DAV:"><oc:filter-rules><oc:favorite>1</oc:favorite></oc:filter-rules><d:prop><d:resourcetype/><d:getcontenttype/><d:getlastmodified/><d:getcontentlength/><oc:size/><oc:favorite/></d:prop></oc:filter-files>';
        const response=await fetch(base,{method:'REPORT',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/xml;charset=UTF-8',requesttoken:csrfToken()},body});
        if(!response.ok)throw Error('HTTP '+response.status);
        entries=parseFavoriteXml(await response.text(),base);
      }
      favoriteState.items=entries;favoritePaths.clear();for(const entry of entries)favoritePaths.add(entry.path);
      favoriteState.status='ready';favoriteState.error='';
      if(activeWorkspace==='files'){
        const list=surface.querySelector('#neos-file-results');if(list)list.innerHTML=browserItems();
      }
    }catch(error){console.error('[Neos] favoris Nextcloud',error);favoriteState.status='error';favoriteState.error='Favoris indisponibles : vérifier WebDAV et les permissions.';}
    renderGlobalSearchResults();
  }
  async function toggleFavorite(entry){
    if(!entry?.path||!validFileFolderPath(entry.path))return;
    const enabled=!favoritePaths.has(entry.path);
    if(demo){enabled?favoritePaths.add(entry.path):favoritePaths.delete(entry.path);favoriteState.status='idle';await loadFavorites();return;}
    const url=favoriteDavUrl(entry.path);if(!url){toast('Chemin de favori invalide','error');return;}
    const body=`<?xml version="1.0"?><d:propertyupdate xmlns:d="DAV:" xmlns:oc="http://owncloud.org/ns"><d:set><d:prop><oc:favorite>${enabled?1:0}</oc:favorite></d:prop></d:set></d:propertyupdate>`;
    try{
      const response=await fetch(url,{method:'PROPPATCH',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/xml;charset=UTF-8',requesttoken:csrfToken()},body});
      if(!response.ok)throw Error('HTTP '+response.status);
      const reply=await response.text();
      if(/<\?xml|multistatus/i.test(reply)&&!/HTTP\/\d(?:\.\d)? 200 /i.test(reply))throw Error('Favori refusé par WebDAV');
      enabled?favoritePaths.add(entry.path):favoritePaths.delete(entry.path);
      toast(enabled?'Ajouté aux favoris Nextcloud':'Retiré des favoris','success');
      favoriteState.status='idle';await loadFavorites();
    }catch(error){console.error('[Neos] modification favori',error);toast('Favori non enregistré sur Nextcloud','error');}
  }

','Taille décroissante']])}</div>`:''}<div class="neos-search-dialog-results" data-global-search-results role="tabpanel"></div><footer>${search?'Recherche par nom, limitée à 2 500 éléments et 6 niveaux de dossiers.':searchPanelTab==='recent'?'<span>Historique propre à ce navigateur et à ce compte.</span><button type="button" class="neos-search-clear" data-action="recent-clear">Effacer l’historique</button>':'Favoris synchronisés avec Nextcloud (WebDAV).'}</footer></section></div>`;

  function renderGlobalSearchResults(){
    const node=popHost.querySelector('[data-global-search-results]');if(!node)return;
    if(searchPanelTab==='favorites'){
      if(favoriteState.status==='loading'){node.innerHTML='<div class="neos-search-status"><span class="neos-spinner"></span> Chargement des favoris Nextcloud…</div>';return;}
      if(favoriteState.status==='error'){node.innerHTML=`<div class="neos-search-status">${icon('alert',18)} ${esc(favoriteState.error)}</div>`;return;}
      node.innerHTML=favoriteState.items.length?`<div class="neos-search-results-list">${favoriteState.items.map(x=>quickResultRow(x,'favorites')).join('')}</div>`:'<div class="neos-search-status">Aucun favori Nextcloud. Utilise l’étoile dans Fichiers.</div>';
      return;
    }
    if(searchPanelTab==='recent'){
      node.innerHTML=recentViewed.length?`<div class="neos-search-results-list">${recentViewed.map(x=>quickResultRow(x,'recent')).join('')}</div>`:'<div class="neos-search-status">Aucun fichier consulté dans Neos avec ce navigateur.</div>';
      return;
    }
    if(globalSearch.loading){node.innerHTML='<div class="neos-search-status"><span class="neos-spinner"></span> Recherche en cours…</div>';return;}
    if(globalSearch.error){node.innerHTML=`<div class="neos-search-status">${icon('alert',18)} ${esc(globalSearch.error)}</div>`;return;}
    if(globalSearch.query.trim().length<2){node.innerHTML='<div class="neos-search-status">Saisis au moins deux caractères pour lancer la recherche.</div>';return;}
    if(!globalSearch.items.length){node.innerHTML='<div class="neos-search-status">Aucun résultat ne correspond aux filtres dans les dossiers parcourus.</div>';return;}
    node.innerHTML=`<div class="neos-search-results-list">${globalSearch.items.map(x=>quickResultRow(x,'search')).join('')}</div>${globalSearch.truncated?'<div class="neos-search-limited">Résultats partiels : limite de recherche atteinte.</div>':''}`;

  async function executeGlobalSearch(){
    const requestId=++globalSearchGeneration;
    const q=globalSearch.query.trim();
    if(q.length<2){globalSearch.loading=false;globalSearch.items=[];globalSearch.error='';renderGlobalSearchResults();return;}
    globalSearch.loading=true;globalSearch.error='';renderGlobalSearchResults();
    try{
      let result;
      if(demo){
        const browses=Object.values(demo.browse||{});
        const cutoff=globalSearch.date==='all'?0:Date.now()/1000-Number(globalSearch.date)*86400;
        const mi=1024*1024;
        let items=browses.flatMap(x=>x.items||[]).filter(x=>x.name.toLocaleLowerCase('fr').includes(q.toLocaleLowerCase('fr'))).filter(x=>{
          if(number(x.mtime)<cutoff)return false;
          if(globalSearch.type==='folder')return x.kind==='folder'&&globalSearch.size==='all';
          if(globalSearch.type!=='all'){
            if(x.kind==='folder')return false;
            const mime=String(x.mime||'').toLowerCase(),extension=ext(x.name);
            const image=mime.startsWith('image/'),audio=mime.startsWith('audio/'),video=mime.startsWith('video/'),doc=mime.startsWith('text/')||['pdf','doc','docx','odt','xls','xlsx','ods','ppt','pptx','odp','txt','md','csv','rtf'].includes(extension);
            if(!({image,video,audio,document:doc,other:!image&&!video&&!audio&&!doc}[globalSearch.type]))return false;
          }
          if(globalSearch.size!=='all'){
            if(x.kind==='folder')return false;
            const z=number(x.size);
            if(globalSearch.size==='small'&&z>=mi)return false;
            if(globalSearch.size==='medium'&&(z<mi||z>=mi*10))return false;
            if(globalSearch.size==='large'&&(z<mi*10||z>=mi*100))return false;
            if(globalSearch.size==='huge'&&z<mi*100)return false;
          }
          return true;
        });
        if(globalSearch.sort==='name')items.sort((a,b)=>a.name.localeCompare(b.name,'fr'));
        else if(globalSearch.sort==='size')items.sort((a,b)=>number(b.size)-number(a.size));
        else items.sort((a,b)=>number(b.mtime)-number(a.mtime));
        result={items:items.slice(0,40).map(x=>({...x,parent:x.path?.slice(0,x.path.lastIndexOf('/'))||'/'})),truncated:items.length>40,visited:items.length};
      }else{
        const url=new URL(root.dataset.searchUrl,window.location.href);
        url.searchParams.set('q',q);
        for(const field of ['type','date','size','sort'])url.searchParams.set(field,globalSearch[field]);
        result=await api(url.toString());
      }
      if(requestId!==globalSearchGeneration||popMode!=='global-search')return;
      globalSearch.items=Array.isArray(result.items)?result.items:[];
      globalSearch.truncated=Boolean(result.truncated);globalSearch.visited=number(result.visited);
      globalSearch.loading=false;renderGlobalSearchResults();
    }catch(error){
      if(requestId!==globalSearchGeneration||popMode!=='global-search')return;
      console.error('[Neos] recherche multi-dossiers',error);
      globalSearch.loading=false;globalSearch.error='Recherche indisponible. Vérifie la mise à jour de Neos.';renderGlobalSearchResults();
    }
  }
